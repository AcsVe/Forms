<!doctype html>
<html lang="{{ lang }}" dir="{{ dir }}">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QR — {{ f.title_for(lang) }}</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;800&display=swap" rel="stylesheet">
<style>
  body{margin:0;font-family:'Tajawal',Tahoma,sans-serif;background:#fff;color:#0f2a52;text-align:center}
  .sheet{max-width:640px;margin:24px auto;padding:24px;border:2px dashed #c9d8ef;border-radius:20px}
  .sheet img.qr{width:100%;max-width:520px;height:auto}
  .hint{color:#475569;font-size:20px;margin:6px 0 0}
  .bar{margin:16px}
  .bar button{font:inherit;font-weight:800;padding:10px 22px;border-radius:10px;border:0;background:#0C67EC;color:#fff;cursor:pointer}
  @media print{.bar{display:none}.sheet{border:0;margin:0 auto}}
</style>
</head>
<body>
<div class="bar"><button type="button" onclick="window.print()">{{ L('طباعة', 'Print') }}</button></div>
<div class="sheet">
  <img class="qr" src="{{ url_for('admin.form_qr', fid=f.id) }}" alt="{{ L('رمز QR للنموذج', 'QR code for the form') }}">
  <p class="hint">{{ L('امسح الرمز بكاميرا الهاتف لفتح النموذج', 'Scan the code with a phone camera to open the form') }}</p>
</div>
<script>window.addEventListener('load', () => { if (new URLSearchParams(location.search).get('auto') === '1') setTimeout(() => window.print(), 400); });</script>
</body>
</html>
